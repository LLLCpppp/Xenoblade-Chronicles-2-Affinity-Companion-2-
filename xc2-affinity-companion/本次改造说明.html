<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>已保存个人规则说明</title><style>body{font:15px/1.9 "Segoe UI","Microsoft YaHei",sans-serif;max-width:900px;margin:40px auto;padding:0 25px;background:#f5f5ed;color:#244537}h1{font-weight:500;font-size:28px}p{color:#61735d}</style><h1>按已保存的个人判定运行</h1><p>打标页面、导航、圆环内打标跳转和编辑按钮已移除。已保存的判定继续决定手动完成或佣兵推进，并保留在当前浏览器及进度备份中。</p><p>新版读取原打标存储、进度备份中的判定，以及新增的只读规则备份。原文件地址和进度存储键保持不变。开环助手会显示载入了多少组判定，帮助确认迁移成功。</p><p>同一浏览器无需重新填写。换浏览器或设备时，需要导入自己的进度备份；页面不会捏造无法读取的个人选择。</p><p>已验证17组模拟判定的完整迁移、按结果分类、只读备份恢复和导入导出；原圆环与讨伐联动检查仍通过。模拟数据仅用于测试，不替代玩家实际判定。</p></html>
